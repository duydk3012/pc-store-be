spring:
  application:
    name: pc-store
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Cấu hình riêng của dự án
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 giờ
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173} # Vite dev server
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000} # FastAPI
